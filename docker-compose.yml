services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?Pass backend/.env with --env-file}
      DIRECT_URL: ${DIRECT_URL:?Pass backend/.env with --env-file}
      JWT_SECRET: ${JWT_SECRET:?Set a unique production JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:?Set the deployed frontend origin}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set allowed frontend origins}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-4000}
      UPLOAD_DIR: /app/uploads
      RESUME_DIR: /tmp/skillswap-resumes
      TRUST_PROXY: ${TRUST_PROXY:-false}
      EMAIL_VERIFY_BASE_URL: ${EMAIL_VERIFY_BASE_URL:?Set the deployed verification URL}
      EMAIL_FROM: ${EMAIL_FROM:?Set a verified sender address}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set the Resend API key}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      ai-service:
        condition: service_healthy
    volumes:
      - skillswap_uploads:/app/uploads
      - skillswap_resume_staging:/tmp/skillswap-resumes
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - skillswap_resume_staging:/tmp/skillswap-resumes:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  skillswap_uploads:
  skillswap_resume_staging:
